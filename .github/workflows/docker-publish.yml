name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # rebuild weekly to pick up base image updates

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 22 & 24 = LTS lines, 26 = current
        node: ["22", "24", "26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          # :<version> for every line; :node<version> alias; :latest and :sha-<commit>
          # on 26 (current); :lts on 24 (newest LTS line)
          tags: |
            type=raw,value=${{ matrix.node }}
            type=raw,value=node${{ matrix.node }}
            type=raw,value=latest,enable=${{ matrix.node == '26' }}
            type=raw,value=lts,enable=${{ matrix.node == '24' }}
            type=sha,format=short,enable=${{ matrix.node == '26' }}

      - name: Build and push (container user)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: NODE_VERSION=${{ matrix.node }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=node-${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}

      - name: Build and push root variant (install container)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node }}
            DEFAULT_USER=root
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.node }}-root
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:node${{ matrix.node }}-root
          cache-from: type=gha,scope=node-${{ matrix.node }}-root
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}-root

  # 9Router (Node) — dibangun dari image resmi + layer egg-compatible.
  # Rebuild otomatis (cron mingguan) => mengikuti update image resmi.
  build-9router:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 9router (non-root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 9router/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:9router
          cache-from: type=gha,scope=9router
          cache-to: type=gha,mode=max,scope=9router

      - name: Build and push 9router-root (install container)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 9router/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: DEFAULT_USER=root
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:9router-root
          cache-from: type=gha,scope=9router-root
          cache-to: type=gha,mode=max,scope=9router-root

  # 9router-go (single Go binary, dibake) — auto-update release via cron mingguan.
  build-9router-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 9router-go (non-root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 9router-go/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:9router-go
          cache-from: type=gha,scope=9router-go
          cache-to: type=gha,mode=max,scope=9router-go

      - name: Build and push 9router-go-root (install container)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 9router-go/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: DEFAULT_USER=root
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:9router-go-root
          cache-from: type=gha,scope=9router-go-root
          cache-to: type=gha,mode=max,scope=9router-go-root
